function normalizeNumericText(value){
  return String(value??'')
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[．。]/g,'.')
    .replace(/，/g,',')
    .replace(/[Ｇｇ]/g,'g')
    .replace(/[Ｍｍ]/g,'m');
}
function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function safeGuideUrl(value){
  try{
    const url=new URL(String(value));
    return url.protocol==='https:' ? url.href : null;
  }catch(e){
    return null;
  }
}

  $('tSec2').textContent='02 · '+t.sec2;
  $('tTitle').textContent=t.title;
  $('tSub').innerHTML=t.sub;
  $('tRequired').innerHTML=t.required;
  $('tPrivacy').textContent=t.privacy;
  $('tGuide').textContent=t.guide;
  $('tAlliance').textContent=t.alliance; $('fAlliance').placeholder=t.alliancePh;
  $('tNick').textContent=t.nick; $('fNick').placeholder=t.nickPh;
  $('tTroop').textContent=t.troop;
  const cur=$('fTroop').value;
  $('fTroop').innerHTML='<option value=""></option>'+TROOP_CANON.map((c,i)=>`<option value="${c}">${t.troops[i]}</option>`).join('');
  $('fTroop').value=cur;
  $('tShelter').textContent=t.shelter; $('fShelter').placeholder=t.shelterPh;
  $('tS1').textContent=t.s1; $('fS1').placeholder=t.s1Ph;

  $('tS3').textContent=t.s3; $('fS3').placeholder=t.s3Ph;
  $('tS4').textContent=t.s4; $('fS4').placeholder=t.s4Ph;
  $('tKills').textContent=t.kills; $('fKills').placeholder=t.killsPh;

  $('tOpt4').textContent=t.opt;
  $('submitBtn').textContent=t.submit;
  $('tDone').textContent=t.done;

/* 전투력 해석: "6.22g"→6220M, "6220"→6220M, "6.22"→6220M, "850m"→850M */
function parsePower(t){
  if(t==null) return null;
  t=normalizeNumericText(t).trim().toLowerCase().replace(/,/g,'').replace(/\s/g,'').replace(/억/g,'');
  if(t==='') return null;
  const m=t.match(/^([0-9]*\.?[0-9]+)(g|m)?$/);
  if(!m) return NaN;
  let v=parseFloat(m[1]);
  if(m[2]==='g') v*=1000;
  else if(m[2]==='m'){}
  else if(v<100) v*=1000;
  return v;
}
function parseKills(t){
  if(t==null) return null;
  t=normalizeNumericText(t).trim().replace(/,/g,'').replace(/\s/g,'');
  if(t==='') return null;
  if(!/^[0-9]+$/.test(t)) return NaN;
  return +t;
}
function fmtG(m){ if(m==null||isNaN(m)) return ''; if(Math.abs(m)>=1000) return (m/1000).toFixed(2).replace(/\.?0+$/,'')+'G'; return (+m.toFixed(1))+'M'; }
function refreshPreview(inp,prev){
  const raw=$(inp).value.trim(), el=$(prev), t=I18N[lang];
  if(!raw){el.textContent='';el.classList.remove('bad');return;}
  if(inp==='fKills'){
    const k=parseKills(raw);
    if(k==null||isNaN(k)||k<=0){el.textContent=t.errKills;el.classList.add('bad');}
    else{el.textContent=t.preview(k.toLocaleString());el.classList.remove('bad');}
    return;
  }
  const v=parsePower(raw);
  if(v==null||isNaN(v)||v<=0){el.textContent=t.badNum;el.classList.add('bad');}
  else{el.textContent=t.preview(fmtG(v));el.classList.remove('bad');}
}
['fS1','fS2','fS3','fS4','fKills'].forEach((id,i)=>$(id).addEventListener('input',()=>refreshPreview(id,'pS'+(i+1))));

function showForm(){ $('formView').style.display='block'; $('doneView').style.display='none'; $('formMsg').textContent=''; }

['fAlliance','fNick'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    localStorage.setItem('sub_'+id,$(id).value);

});
['fTroop','fShelter'].forEach(id=>{
  $(id).addEventListener('change',()=>{
    localStorage.setItem('sub_'+id,$(id).value);

});


async function doSubmit(){
  if(submitting) return;

  const t=I18N[lang];
  const alliance=$('fAlliance').value.trim();
  const nick=$('fNick').value.trim();

  const showError=message=>{
    $('formMsg').style.color='var(--red)';
    $('formMsg').textContent=message;
  };

  if(!alliance){showError(t.errAlliance);return;}
  if(!nick){showError(t.errNick);return;}

  const troopValue=$('fTroop').value;
  if(!troopValue){showError(t.errTroop);return;}

  const shelter=normalizeNumericText($('fShelter').value)
    .trim()
    .replace(/\s/g,'');
  if(!/^[0-9]{1,4}$/.test(shelter)||Number(shelter)<=0){
    showError(t.errShelter);
    return;
  }
  $('fShelter').value=shelter;

  const s1=parsePower($('fS1').value);
  if(s1==null||isNaN(s1)||s1<=0){showError(t.errS1);return;}

  const req=id=>{
    const v=parsePower($(id).value);
    return (v==null||isNaN(v)||v<=0)?null:v;
  };

  const s2=req('fS2');
  const s3=req('fS3');
  if(s2===null||s3===null){showError(t.errS234);return;}

  let s4=null;
  if($('fS4').value.trim()!==''){
    s4=req('fS4');
    if(s4===null){showError(t.badNum);return;}
  }

  const kills=parseKills($('fKills').value);
  if(kills==null||isNaN(kills)||kills<=0){
    showError(t.errKills);
    return;
  }

  const troopText=$('fTroop').selectedOptions[0]?.textContent||'';

  const confirmLines=[
    t.alliance+': '+alliance.toUpperCase(),
    t.nick+': '+nick
  ];
  confirmLines.push(t.troop+': '+troopText);
  confirmLines.push(t.shelter+': '+shelter);

  [[0,s1],[1,s2],[2,s3],[3,s4]]
    .filter(([,v])=>v)
    .forEach(([i,v])=>confirmLines.push(t.squadWord[i]+': '+fmtG(v)));
  confirmLines.push(t.kills+': '+kills.toLocaleString());

  if(!confirm(t.confirmQ+'\n\n'+confirmLines.join('\n'))) return;

  submitting=true;
  $('submitBtn').disabled=true;
  $('formMsg').style.color='var(--muted)';
  $('formMsg').textContent=t.submitting;

  try{
    const {data,error}=await sb.rpc('submit_power',{
      p_server:'213',
      p_alliance:alliance,
      p_nickname:nick,
      p_troop:troopValue,
      p_shelter:shelter,
      p_s1:s1,
      p_s2:s2,
      p_s3:s3,
      p_s4:s4,
      p_kills:kills
    });

    if(error){
      showError(t.networkErr+': '+error.message);
      return;
    }

    if(data!=='ok'){
      const msgs={
        no_nickname:t.errNick,
        no_alliance:t.errAlliance,
        no_troop:t.errTroop,
        no_shelter:t.errShelter,
        bad_shelter:t.errShelter,
        too_long:t.errLong,
        bad_power:t.errS1
      };
      showError(msgs[data]||('Error: '+data));
      return;
    }

    ['fAlliance','fNick','fTroop','fShelter'].forEach(
      id=>localStorage.setItem('sub_'+id,$(id).value)
    );

    const summaryParts=[[0,s1],[1,s2],[2,s3],[3,s4]]
      .filter(([,v])=>v)
      .map(([i,v])=>t.squadWord[i]+' '+fmtG(v))
      .concat([t.kills+' '+kills.toLocaleString()])
      .join(' · ');

    $('doneSummary').innerHTML=
      `<b>${escapeHtml(alliance.toUpperCase())} · ${escapeHtml(nick)}</b><br>`+
      `${escapeHtml(summaryParts)}<br><br>${t.doneTail}`;

    ['fS1','fS2','fS3','fS4','fKills'].forEach(id=>{$(id).value='';});
    ['pS1','pS2','pS3','pS4','pS5'].forEach(id=>{$(id).textContent='';});

    $('formView').style.display='none';
    $('doneView').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(error){
    showError(t.networkErr+': '+(error?.message||String(error)));
  }finally{
    submitting=false;
    $('submitBtn').disabled=false;
  }
}

async function loadGuideImgs(){
  try{
    const {data}=await sb.rpc('get_submit_guide');
    const g=JSON.parse(data||'{}');
    const urls=Array.isArray(g.images)
      ? g.images.map(safeGuideUrl).filter(Boolean)
      : [];

    if(!urls.length) return;

    const width=Math.min(100,Math.max(30,Number(g.width)||90))+'%';
    const wrap=$('guideImgs');
    wrap.replaceChildren();

    urls.forEach(url=>{
      const img=document.createElement('img');
      img.src=url;
      img.alt=I18N[lang].guide;
      img.style.width=width;
      img.loading='lazy';
      img.addEventListener('click',()=>window.open(url,'_blank','noopener'));
      wrap.appendChild(img);
    });

    $('guideSec').style.display='block';
  }catch(e){}
}

window.onerror=function(msg,src,line){
  try{
    const el=$('formMsg');
    if(el){
      const t=I18N[lang]||I18N.ko;
      el.style.color='var(--red)';
      el.textContent=t.runtimeErr+' ('+line+')';
    }
  }catch(e){}
};
function init(){
  const saved=localStorage.getItem('sub_lang');
  const nav=(navigator.language||'ko').slice(0,2);
  setLang(saved||({'en':'en','ja':'ja','zh':'zh'}[nav]||'ko'));
  if(!CONFIG.SUPABASE_URL.startsWith('https://')){
    document.querySelector('.box').innerHTML='<h1>⚠️ 설정 필요</h1><div class="sub">submit.html 상단의 CONFIG에 Supabase URL과 anon key를 붙여넣어주세요.</div>';
    return;
  }
  if(!window.supabase){
    var el=document.getElementById('gateMsg')||document.getElementById('formMsg');
    if(el){el.style.color='#FF6B6B';el.textContent=(I18N[lang]||I18N.ko).scriptFail;}
    return;
  }
  sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  ['fAlliance','fNick','fTroop','fShelter'].forEach(id=>{const v=localStorage.getItem('sub_'+id);if(v)$(id).value=v;});
  loadGuideImgs();
}
init();
