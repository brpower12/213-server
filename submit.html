function setLang(l){
  lang=l; localStorage.setItem('sub_lang',l);
  document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('active',b.dataset.l===l));
  const t=I18N[l];
  document.title=t.title;
  $('tTitle').textContent=t.title;
  $('tSub').innerHTML=t.sub;
  $('tGuide').textContent=t.guide;
  $('tAlliance').textContent=t.alliance; $('fAlliance').placeholder=t.alliancePh;
  $('tNick').textContent=t.nick; $('fNick').placeholder=t.nickPh;
  $('tTroop').textContent=t.troop;
  const cur=$('fTroop').value;
  $('fTroop').innerHTML='<option value=""></option>'+TROOP_CANON.map((c,i)=>`<option value="${c}">${t.troops[i]}</option>`).join('');
  $('fTroop').value=cur;
  $('tShelter').textContent=t.shelter; $('fShelter').placeholder=t.shelterPh;
  $('tS1').textContent=t.s1; $('fS1').placeholder=t.s1Ph;
  $('tS2').textContent=t.s2; $('fS2').placeholder=t.s2Ph;
  $('tS3').textContent=t.s3; $('fS3').placeholder=t.s3Ph;
  $('tS4').textContent=t.s4; $('fS4').placeholder=t.s4Ph;
  ['tOpt2','tOpt3','tOpt4'].forEach(id=>$(id).textContent=t.opt);
  $('submitBtn').textContent=t.submit;
  $('tDone').textContent=t.done;
  $('againBtn').textContent=t.again;
  ['fS1','fS2','fS3','fS4'].forEach((id,i)=>refreshPreview(id,'pS'+(i+1)));
}

/* 전투력 해석: "6.22g"→6220M, "6220"→6220M, "6.22"→6220M, "850m"→850M */
function parsePower(t){
  if(t==null) return null;
  t=String(t).trim().toLowerCase().replace(/,/g,'').replace(/\s/g,'').replace(/억/g,'');
  if(t==='') return null;
  const m=t.match(/^([0-9]*\.?[0-9]+)(g|m)?$/);
  if(!m) return NaN;
  let v=parseFloat(m[1]);
  if(m[2]==='g') v*=1000;
  else if(m[2]==='m'){}
  else if(v<100) v*=1000;
  return v;
}
function fmtG(m){ if(m==null||isNaN(m)) return ''; if(Math.abs(m)>=1000) return (m/1000).toFixed(2).replace(/\.?0+$/,'')+'G'; return (+m.toFixed(1))+'M'; }
function refreshPreview(inp,prev){
  const raw=$(inp).value.trim(), el=$(prev), t=I18N[lang];
  if(!raw){el.textContent='';el.classList.remove('bad');return;}
  const v=parsePower(raw);
  if(v==null||isNaN(v)||v<=0){el.textContent=t.badNum;el.classList.add('bad');}
  else{el.textContent=t.preview(fmtG(v));el.classList.remove('bad');}
}
['fS1','fS2','fS3','fS4'].forEach((id,i)=>$(id).addEventListener('input',()=>refreshPreview(id,'pS'+(i+1))));

function showForm(){ $('formView').style.display='block'; $('doneView').style.display='none'; $('formMsg').textContent=''; }

async function doSubmit(){
  const t=I18N[lang];
  const alliance=$('fAlliance').value.trim();
  const nick=$('fNick').value.trim();
  if(!alliance){$('formMsg').style.color='var(--red)';$('formMsg').textContent=t.errAlliance;return;}
  if(!nick){$('formMsg').style.color='var(--red)';$('formMsg').textContent=t.errNick;return;}
  const s1=parsePower($('fS1').value);
  if(s1==null||isNaN(s1)||s1<=0){$('formMsg').style.color='var(--red)';$('formMsg').textContent=t.errS1;return;}
  const opt=id=>{const v=parsePower($(id).value); return (v==null||isNaN(v)||v<=0)?null:v;};
  const s2=opt('fS2'), s3=opt('fS3'), s4=opt('fS4');
  for(const [id,v] of [['fS2',s2],['fS3',s3],['fS4',s4]]){
    if($(id).value.trim()&&v===null){$('formMsg').style.color='var(--red)';$('formMsg').textContent=t.errS;return;}
  }
  const cparts=[[0,s1],[1,s2],[2,s3],[3,s4]].filter(([,v])=>v).map(([i,v])=>t.squadWord[i]+': '+fmtG(v)).join('\n');
  if(!confirm(t.confirmQ+'\n\n'+t.alliance+': '+alliance.toUpperCase()+'\n'+t.nick+': '+nick+'\n'+cparts)) return;
  $('submitBtn').disabled=true;
  $('formMsg').style.color='var(--muted)'; $('formMsg').textContent=t.submitting;
  const {data,error}=await sb.rpc('submit_power',{
    p_server:'213', p_alliance:alliance, p_nickname:nick,
    p_troop:$('fTroop').value, p_shelter:$('fShelter').value.trim(),
    p_s1:s1, p_s2:s2, p_s3:s3, p_s4:s4
  });
  $('submitBtn').disabled=false;
  if(error){$('formMsg').style.color='var(--red)';$('formMsg').textContent='Error: '+error.message;return;}
  if(data!=='ok'){
    const msgs={no_nickname:t.errNick,no_alliance:t.errAlliance,too_long:t.errLong,bad_power:t.errS1};
    $('formMsg').style.color='var(--red)';$('formMsg').textContent=msgs[data]||('Error: '+data);return;
  }
  ['fAlliance','fNick','fTroop','fShelter'].forEach(id=>localStorage.setItem('sub_'+id,$(id).value));
  const parts=[[0,s1],[1,s2],[2,s3],[3,s4]].filter(([,v])=>v).map(([i,v])=>t.squadWord[i]+' '+fmtG(v)).join(' · ');
  $('doneSummary').innerHTML=`<b>${alliance.toUpperCase()} · ${nick}</b><br>${parts}<br><br>${t.doneTail}`;
  ['fS1','fS2','fS3','fS4'].forEach(id=>{$(id).value='';});
  ['pS1','pS2','pS3','pS4'].forEach(id=>{$(id).textContent='';});
  $('formView').style.display='none'; $('doneView').style.display='block';
}

async function loadGuideImgs(){
  try{
    const {data}=await sb.rpc('get_submit_guide');
    const g=JSON.parse(data||'{}');
    if(g.images&&g.images.length){
      const w=(g.width||90)+'%';
      $('guideImgs').innerHTML=g.images.map(u=>`<img src="${u}" style="width:${w}" onclick="window.open('${u}','_blank')">`).join('');
      $('guideSec').style.display='block';
    }
  }catch(e){}
}

function init(){
  const saved=localStorage.getItem('sub_lang');
  const nav=(navigator.language||'ko').slice(0,2);
  setLang(saved||({'en':'en','ja':'ja','zh':'zh'}[nav]||'ko'));
  if(!CONFIG.SUPABASE_URL.startsWith('https://')){
    document.querySelector('.box').innerHTML='<h1>⚠️ 설정 필요</h1><div class="sub">submit.html 상단의 CONFIG에 Supabase URL과 anon key를 붙여넣어주세요.</div>';
    return;
  }
  sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  ['fAlliance','fNick','fTroop','fShelter'].forEach(id=>{const v=localStorage.getItem('sub_'+id);if(v)$(id).value=v;});
  loadGuideImgs();
}
init();
</script>
